name: Publish to gh-pages

# Pages is served from the gh-pages branch, so this rebuilds that branch from
# the app files on every push. It uses only contents:write, which the Actions
# token does get — unlike creating a Pages site, which needs repo-admin.

on:
  push:
    branches: [claude/buildwood-moves-india-rules-ja69fo]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and publish the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js assets .nojekyll _site/
          echo "--- publishing ---"
          find _site -type f | sort
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
