name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/buildwood-moves-india-rules-ja69fo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Note: enablement:true is deliberately NOT set. The Actions token cannot
      # create a Pages site (needs repo-admin), so it only hard-fails the run.
      # Pages is switched on once in Settings; after that this deploys on push.
      - uses: actions/configure-pages@v5

      # Publish only what the app needs. The README, submission pack and test
      # harness stay in the repo for anyone reading it, but are not served.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js assets .nojekyll _site/
          echo "--- publishing ---"
          find _site -type f | sort
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
